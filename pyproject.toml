[project]
name = "sms-toolkit"
version = "0.1.0"
description = "Refactored ss-sms-br: Android SMS/call backup de-duplication, analysis and viewing toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml",
    "tqdm",
]

[project.optional-dependencies]
excel = ["pandas", "openpyxl"]
viewer = ["flask"]
ocr = ["pillow", "numpy", "pytesseract", "easyocr", "opencv-python", "fuzzywuzzy"]
dev = ["pytest", "ruff", "mypy", "lxml-stubs", "types-tqdm", "types-openpyxl"]

[project.scripts]
sms-toolkit = "sms_toolkit.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sms_toolkit = ["viewer/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Relocated original kept byte-identical (see the mypy override below).
exclude = ["src/sms_toolkit/tools/export_to_md.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixture XML blobs in the test helpers are data, not code.
"tests/diff_helpers.py" = ["E501"]
# SQL ported verbatim from the originals; reformatting would only add diff noise.
"src/sms_toolkit/stages/normalize_messages.py" = ["E501"]
"src/sms_toolkit/stages/export_year.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
show_error_codes = true
warn_unused_ignores = true

# Relocated original kept byte-identical (has a latent str/list type
# inconsistency in the 1-to-1 mirroring branch); clean it only if it ever
# becomes product code.
[[tool.mypy.overrides]]
module = "sms_toolkit.tools.export_to_md"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
