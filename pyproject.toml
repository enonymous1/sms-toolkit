[project]
name = "sms-toolkit"
version = "0.1.0"
description = "Refactored ss-sms-br: Android SMS/call backup de-duplication, analysis and viewing toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lxml",
    "tqdm",
]

[project.optional-dependencies]
excel = ["pandas", "openpyxl"]
viewer = ["flask"]
ocr = ["pillow", "numpy", "pytesseract", "easyocr", "opencv-python", "fuzzywuzzy"]
dev = ["pytest", "ruff", "mypy", "lxml-stubs", "types-tqdm"]

[project.scripts]
sms-toolkit = "sms_toolkit.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixture XML blobs in the test helpers are data, not code.
"tests/diff_helpers.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
show_error_codes = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
