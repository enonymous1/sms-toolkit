[project]
name = "sms-toolkit"
version = "0.1.0"
description = "De-duplicate SMS Backup & Restore XML backups into SQLite, normalize contacts, export MMS attachments, OCR screenshots, and browse it all in a messaging-style web viewer — one sms-toolkit CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "enonymous1" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: Database",
    "Topic :: Utilities",
]
keywords = ["sms", "mms", "android", "backup", "deduplication", "sqlite", "flask", "cli"]
dependencies = [
    "lxml>=4.9",
    "tqdm>=4.64",
]

[project.urls]
Homepage = "https://github.com/enonymous1/sms-toolkit"
Repository = "https://github.com/enonymous1/sms-toolkit"

[project.optional-dependencies]
excel = ["pandas>=2.0", "openpyxl>=3.1"]
viewer = ["flask>=2.0"]
# easyocr pulls torch (~2 GB) plus model downloads on first run; see README.
# opencv-python-headless (not opencv-python) is correct here: no GUI preview
# is ever used, and the full variant requires libGL, breaking headless CI.
# thefuzz is the maintained fork of the abandoned fuzzywuzzy.
ocr = [
    "pillow>=9.0",
    "numpy>=1.24",
    "pytesseract>=0.3.10",
    "easyocr>=1.7",
    "opencv-python-headless>=4.8",
    "thefuzz>=0.19",
]
dev = ["pytest", "ruff", "mypy", "lxml-stubs", "types-tqdm", "types-openpyxl"]

[project.scripts]
sms-toolkit = "sms_toolkit.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sms_toolkit = ["viewer/templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Relocated original kept byte-identical (see the mypy override below).
exclude = ["src/sms_toolkit/tools/export_to_md.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Fixture XML blobs in the test helpers are data, not code.
"tests/diff_helpers.py" = ["E501"]
# SQL ported verbatim from the originals; reformatting would only add diff noise.
"src/sms_toolkit/stages/export_year.py" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.10"
show_error_codes = true
warn_unused_ignores = true

# Relocated original kept byte-identical (has a latent str/list type
# inconsistency in the 1-to-1 mirroring branch); clean it only if it ever
# becomes product code.
[[tool.mypy.overrides]]
module = "sms_toolkit.tools.export_to_md"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
